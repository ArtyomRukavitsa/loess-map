name: Deploy map to Object Storage

# CD: при пуше собранной карты в main — авто-деплой в Yandex Object Storage (static website hosting).
# Требуется добавить в Settings -> Secrets -> Actions:
#   YC_ACCESS_KEY  (AWS_ACCESS_KEY_ID из .secrets)
#   YC_SECRET_KEY  (AWS_SECRET_ACCESS_KEY из .secrets)
on:
  push:
    branches: [main]
    paths:
      - "static_site/index.html"
  workflow_dispatch: {}      # можно запустить вручную

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload index.html to Object Storage (bucket loess-map)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws s3 cp static_site/index.html s3://loess-map/index.html \
            --endpoint-url https://storage.yandexcloud.net \
            --content-type "text/html; charset=utf-8"
          echo "Deployed -> https://loess-map.website.yandexcloud.net"
